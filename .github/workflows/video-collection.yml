name: Video Collection Engine

on:
  schedule:
    # Runs every 30 minutes at minutes 7 and 37
    # (~48 runs/day, ~1440 runs/month)
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      target_new_links:
        description: 'Target new unique video links'
        required: false
        default: '200'
      max_new_links:
        description: 'Max cap on new video links'
        required: false
        default: '300'
      dry_run:
        description: 'Dry run mode (do not commit to DB)'
        required: false
        type: boolean
        default: false

# Concurrency group ensures only one collection runs at a time
concurrency:
  group: video-collection
  cancel-in-progress: false

jobs:
  collect-videos:
    name: Collect & Discover Videos
    runs-on: ubuntu-slim
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline || npm install --omit=dev

      - name: Run Video Discovery Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_NEW_LINKS_PER_RUN: ${{ github.event.inputs.target_new_links || '200' }}
          MAX_NEW_LINKS_PER_RUN: ${{ github.event.inputs.max_new_links || '300' }}
          BATCH_SIZE: 50
          MAX_EXECUTION_TIME_SECONDS: 150
          CONCURRENCY_LIMIT: 2
          DB_WARNING_THRESHOLD_PERCENT: 70
          DB_CRITICAL_THRESHOLD_PERCENT: 80
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          node src/collector/index.js
